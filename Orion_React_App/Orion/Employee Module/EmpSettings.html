    <link rel="stylesheet" href="/styles.css">
        <style>
        * {
        box-sizing:border-box;
        margin:0px;
        padding:0px;
       }

        body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        }

        .container {
        padding: 64px;
        }

        .row:after {
        content: "";
        display: table;
        clear: both
        }

        .column-66 {
        float: left;
        width: 66.66666%;
        padding: 20px;
        }

        .column-33 {
        float: left;
        width: 33.33333%;
        padding: 20px;
        }

        .large-font {
        font-size: 48px;
        }

        .xlarge-font {
        font-size: 64px
        }

        .button {
        border: none;
        color: white;
        padding: 14px 28px;
        font-size: 16px;
        cursor: pointer;
        background-color: #04AA6D;
        }

        img {
        display: block;
        height: auto;
        max-width: 100%;
        border-radius: 50px;
        }

        @media screen and (max-width: 1000px) {
        .column-66,
        .column-33 {
            width: 100%;
            text-align: center;
        }
        img {
            margin: auto;
        }
        }

        .footer{
            position:relative;
            display: inline-block;
            bottom: -130px;
        }

        .logo img {
            height:110px;
            border-radius: 5px;
        }

        .containerac {
            display: flex;
            min-height: 100vh;
            overflow: scroll;
            z-index: 6;
        }

        .sidebar {
            width: 250px;
            background-color: black;
            padding: 2rem;
            left:0px;
            top:110px;
            position: fixed;
            height: 100vh;
            z-index: 5;
        }

        .menu-item {
            padding: 1rem;
            color: white;
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            transition: background-color 0.3s;
            overflow: scroll;
        }

        .menu-item:hover {
            background-color: bisque;
            color: black;
            font-style: italic;
        }

        .menu-item.active {
            background-color: white;
            color: black;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            margin-left: 250px; /* Adjusted to account for sidebar width */
            margin-bottom: 100px;
            background-repeat: no-repeat;
            background-size:cover;
            min-height: 80vh;
            top:110px;
            position: absolute;
            right:0px;
            left:0px;
            bottom: 250px;
            overflow: scroll;            
        }


        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .new-appointment-btn {
            background-color: #27ae60;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .new-appointment-btn:hover {
            background-color: #219a52;
        }

        .appointments-list {
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.39);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            align-items:flex-start;
            justify-items:flex-start;
            overflow: scroll;
        }

        .appointment-card {
            border: 1px solid #e0e0e0;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            font-size: small;
            overflow: scroll;
        }

        .profile-settings {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .save-settings-btn {
            background-color: #2980b9;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .footer {
            position: fixed;
            bottom: 0;
            height: 90px;
            z-index: 99999;
        }

        .bkimg {
            display:block;
            position:fixed;
            top:110px;
            left:250px;
            background-image: url('/images/AnnexA.png');
            background-size:cover;
            background-attachment:fixed;
            background-position:bottom;
            background-repeat: no-repeat;
            filter: blur(5px);
            width:100%;
            height:100%;
            z-index:-2;}

        .sg {
            position: fixed;
            bottom: -10px;
            right: 0;
            width: 200px;
            height: 100px;
            margin-right: 50px;
            padding: 0px;
            z-index: 5;
            border-radius: 5px;}

        #Profile_pic {
            width: 100px;
            margin: 5px;
            border-radius: 50px;
        }

        #formvalue {
            margin:5px;
            width: 170px;
            height: 30px;
            color: black;
            background-color:rgba(255, 255, 255, 0.743);
            border-radius: 50px;
            border-color: chocolate;
            text-align:center;
        }


        </style>
