<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Admin Appointments</title>
    <link rel="icon" href="/Orion earth.png"/x-icon>
    <link rel="stylesheet" href="style.css">
</head>

    <link rel="stylesheet" href="/styles.css">
        <style>
        * {
        box-sizing:border-box;
        margin:0px;
        padding:0px;
       }

        body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        }

        .container {
        padding: 64px;
        }

        .row:after {
        content: "";
        display: table;
        clear: both
        }

        .column-66 {
        float: left;
        width: 66.66666%;
        padding: 20px;
        }

        .column-33 {
        float: left;
        width: 33.33333%;
        padding: 20px;
        }

        .large-font {
        font-size: 48px;
        }

        .xlarge-font {
        font-size: 64px
        }

        .button {
        border: none;
        color: white;
        padding: 14px 28px;
        font-size: 16px;
        cursor: pointer;
        background-color: #04AA6D;
        }

        img {
        display: block;
        height: auto;
        max-width: 100%;
        border-radius: 50px;
        }

        @media screen and (max-width: 1000px) {
        .column-66,
        .column-33 {
            width: 100%;
            text-align: center;
        }
        img {
            margin: auto;
        }
        }

        .footer{
            position:relative;
            display: inline-block;
            bottom: -130px;
        }

        .logo img {
            height:110px;
            border-radius: 5px;
        }

        .containerac {
            display: flex;
            min-height: 100vh;
            overflow: scroll;
            z-index: 6;
        }

        .sidebar {
            width: 250px;
            background-color: black;
            padding: 2rem;
            left:0px;
            top:110px;
            position: fixed;
            height: 100vh;
            z-index: 5;
        }

        .menu-item {
            padding: 1rem;
            color: white;
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            transition: background-color 0.3s;
            overflow: scroll;
        }

        .menu-item:hover {
            background-color: bisque;
            color: black;
            font-style: italic;
        }

        .menu-item.active {
            background-color: white;
            color: black;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            margin-left: 250px; /* Adjusted to account for sidebar width */
            margin-bottom: 250px;
            background-repeat: no-repeat;
            background-size:cover;
            min-height: 80vh;
            min-width: 40vw;
            top:110px;
            position: absolute;
            right:0px;
            left:0px;
            overflow: scroll;    
            bottom: 250px;        
        }


        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .new-appointment-btn {
            background-color: #27ae60;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .new-appointment-btn:hover {
            background-color: #219a52;
        }

        .appointments-list {
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.39);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 40vw;
            align-items:flex-start;
            justify-items:flex-start;
            overflow: scroll;
        }

        .appointment-card {
            border: 1px solid #e0e0e0;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            font-size: small;
            overflow: scroll;
        }

        .profile-settings {
            background-color: white;
            border-radius: 10px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .save-settings-btn {
            background-color: #2980b9;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .footer {
            position: fixed;
            bottom: 0;
            height: 90px;
        }

        .bkimg {
            display:block;
            position:fixed;
            top:110px;
            left:250px;
            background-image: url('/images/AnnexA.png');
            background-size:cover;
            background-attachment:fixed;
            background-position:bottom;
            background-repeat: no-repeat;
            filter: blur(5px);
            width:100%;
            height:100%;
            z-index:-2;}

        .sg {
            position: fixed;
            bottom: -10px;
            right: 0;
            width: 200px;
            height: 100px;
            margin-right: 50px;
            padding: 0px;
            z-index: 5;
            border-radius: 5px;}


        </style>
        


<body>
    <div class="navbar">
        <div class="logo">
          <img src="/images/ORION.jpg" alt="Orion Logo">
        </div>
        <div class="nav-links">
          <a class="navbut-log" href="/login.html">Logout</a>
        </div>
    </div>
    
    
        
    <div class="containerac">
            <div class="sidebar">
                <a href="EmpApp.html" class="menu-item">Appointments</a>
                <a href="EmpSesHx.html" class="menu-item">Session History</a>
                <a href="EmpSettings.html" class="menu-item">Account Settings</a>
                <a href="Blogsubmit.html" class="menu-item active">Submit a Blog</a>
            </div>
        
            <div class="main-content">
                <div type="background-image" href="images/AnnexA.png" class="bkimg"></div>
                <div class="content-header">
                    <h2 style="color:#000000; background-color: antiquewhite; padding:10px; border-radius:15px; border-color: antiquewhite;">Compose a blog</h2>
                </div>
                <div class="appointments-list">
                    <input type="text" name="concer" id="concern" placeholder="Compose a blog here and upload the pictures as jpeg files." style="display:flexbox; flex-wrap: wrap; height: 400px; width: 1000px; border-radius: 50px; background-color: rgba(250, 235, 215, 0.862); color: #000000; text-wrap: wrap; vertical-align: text-top;"><br>
                    <button class="new-appointment-btn">SUBMIT</button>

                </div>
            </div><br><br><br>
    </div><br>

    
    <div class="footer">
        <p>&copy; 2025 Orion Interface Philippines, Inc. &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; All rights reserved under Albetros Philippines, Inc.</p>

    </div>

    
</body>
</html>
